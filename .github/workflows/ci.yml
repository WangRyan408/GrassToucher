# Typecheck, tests, and proof that the image still builds.
#
# No `push:` trigger on purpose — publish.yml calls this workflow, so a merge to main would
# otherwise run the whole suite twice and report it in two places.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1'

      # --frozen-lockfile: CI resolving a newer version than bun.lock pins is a green run
      # that proves nothing about what the image will contain.
      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # `bun run test`, never `bun test` — the latter starts bun's own test runner and never
      # reads the `test` script, so vitest wouldn't run at all and it would still pass.
      - name: Test
        run: bun run test

  # The Dockerfile is the one thing tests can't cover, and a broken one only shows up at
  # deploy time. Building it here (without pushing) moves that to the pull request.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # publish.yml reads this cache on main, so its build is mostly a re-tag.
          cache-from: type=gha
          cache-to: type=gha,mode=max
