# Pull the new image on the host and restart the bot.
#
# Runs itself after a successful Publish, and can be run by hand from the Actions tab with any
# tag that's already in GHCR — which is the rollback: dispatch with an older commit sha.
name: Deploy

on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy (a commit sha, or latest)
        default: latest

# One deploy at a time. Two merges in quick succession queue instead of both reaching for
# docker compose on the same host at once.
concurrency:
  group: deploy

permissions:
  contents: read

jobs:
  deploy:
    # workflow_run fires on failure and cancellation too, so the conclusion has to be checked
    # here — there is no `types: [success]`.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production # Add required reviewers here if you ever want deploys gated.
    env:
      # The host's LAN address, reached through the tunnel — see the tunnel step below. NOT
      # 10.13.13.1, which two different WireGuard instances on that box both claim: the live
      # NetworkManager-owned `wg0` on the host, and the linuxserver container nothing routes to.
      # One of them has sshd and the other doesn't, and the address alone doesn't say which you
      # get. `192.168.50.9` is unambiguous, and it's the single /32 that WG_CONFIG's AllowedIPs
      # permits — the same path every other peer already uses to reach services on this box.
      #
      # Deliberately a literal and not a secret: an RFC1918 address only reachable through the
      # tunnel reveals nothing, and reading it here beats an opaque secret when a deploy misbehaves.
      SSH_HOST: 192.168.50.9
      SSH_USER: ${{ secrets.SSH_USER }}
      # The automatic path deploys the exact commit that was just built, not `latest`, so
      # `docker compose ps` on the host names the running commit.
      TAG: ${{ inputs.tag || github.event.workflow_run.head_sha }}
    steps:
      # The host is behind NAT — there is no public address to SSH to, and the only port forwarded
      # at the router is WireGuard's. So the runner joins the tunnel as a peer named `ci` and
      # reaches sshd over it.
      #
      # WG_CONFIG is a hand-edited copy of the generated `peer_ci.conf`, and both edits matter.
      # AllowedIPs is 192.168.50.9/32 and nothing else — the generated file offers the whole
      # 192.168.50.0/24, which would put every other service in the house one leaked secret away.
      # And `Endpoint` must name port **51820**: the generator writes 51821 because that is what
      # the container publishes, but the router forwards 51820 to the host's own wg0, so a config
      # trusting the generated port is dropped at the router with no error anywhere.
      - name: Join the tunnel
        env:
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wireguard-tools
          # chmod rather than relying on umask: sudo resets it, and wg-quick warns about a
          # world-readable private key.
          printf '%s\n' "$WG_CONFIG" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

          # `wg-quick up` configures an interface; it never handshakes, so it exits 0 even when the
          # far end is unreachable. WireGuard then retries in silence — no error, no ICMP — and the
          # first thing to actually notice would be ssh timing out, which reads identically to a
          # dead sshd or a wrong key. A ping makes the tunnel own its own failures.
          #
          # The handshake is triggered by the first outbound packet, so the ping is both the test
          # and the trigger. Three attempts rather than one: a single 5s window can't tell a dead
          # path from a slow first handshake, and guessing wrong costs a whole CI round trip.
          for i in 1 2 3; do
            if ping -c1 -W5 "$SSH_HOST"; then reached=1; break; fi
            echo "attempt $i: no reply"
          done

          # This is what a bare ping failure can't tell you, and not knowing it cost an afternoon.
          # A completed handshake with no ping reply means routing or firewall on the host. NO
          # handshake means the packets never reached a WireGuard instance that could authenticate
          # them at all — the router's UDP forward, or a stale Endpoint — and the credentials are
          # not the thing to go re-checking.
          sudo wg show

          [[ -n ${reached:-} ]]

      # No actions/checkout: this workflow only opens an SSH connection.
      - name: Load the deploy key
        # Secrets arrive through `env`, never interpolated into the script body — a `${{ }}`
        # inside a run: block is pasted in as text before bash sees it, which is a shell
        # injection seam for anything an attacker can influence.
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # A pinned fingerprint, not `ssh-keyscan` at deploy time: keyscan trusts whatever
          # answers on port 22, which is the one thing a private key must not do.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The tag is the entire request. What runs on the other end is `deploy/host-deploy.sh`,
      # pinned as a forced command on the host key, so this cannot ask for a shell, a different
      # directory, or a script of its own choosing — see that file's header.
      #
      # BatchMode and StrictHostKeyChecking are belt and braces on top of the pinned
      # known_hosts: a runner has no tty, and a prompt it can't answer should fail the job
      # rather than hang until the six-hour timeout.
      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "$TAG"

      # Runners are torn down after the job, so this is hygiene rather than necessity — but it runs
      # on failure too, so a deploy that dies mid-SSH still leaves a clean log line about the
      # tunnel going down instead of an interface nobody closed.
      - name: Leave the tunnel
        if: always()
        run: sudo wg-quick down wg0 || true
